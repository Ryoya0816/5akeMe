# 5akeMe 本番用 Docker Compose（1GB VPS 想定・軽量化）
# 使い方: ローカルで npm run build 済みの api をデプロイし、VPS で
#   docker compose -f docker-compose.production.yml up -d
# Vite はサーバでビルドしない（成果物を rsync/git で配置）

services:
  web:
    image: nginx:alpine
    container_name: 5akeme-nginx
    ports:
      - "80:80"
    volumes:
      - ./api:/var/www/html:ro
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - appnet

  app:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: 5akeme-app
    working_dir: /var/www/html
    volumes:
      - ./api:/var/www/html
    depends_on:
      - db
    environment:
      - APP_ENV=production
      - PYTHON_API_URL=http://python:8000
    networks:
      - appnet

  python:
    build:
      context: .
      dockerfile: ./docker/python/Dockerfile
    container_name: 5akeme-python
    working_dir: /app
    volumes:
      - ./python:/app
      - python_data:/app/data
    environment:
      - DATABASE_URL=mysql+pymysql://${DB_USERNAME:-laravel}:${DB_PASSWORD:-laravel}@db:3306/${DB_DATABASE:-laravel}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    depends_on:
      - db
    networks:
      - appnet

  db:
    image: mysql:8.0
    container_name: 5akeme-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-laravel}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - appnet
    deploy:
      resources:
        limits:
          memory: 400M
        reservations:
          memory: 256M

volumes:
  dbdata:
  python_data:

networks:
  appnet:
    driver: bridge
