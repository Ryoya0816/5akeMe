services:
  web:
    image: nginx:alpine
    container_name: 5akeme-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./api:/var/www/html:ro
      - ./docker/nginx/production.ssl.conf:/etc/nginx/conf.d/default.conf:ro
      # Host cert path -> container path
      # Example:
      #   /etc/letsencrypt/live/your-domain/fullchain.pem
      #   /etc/letsencrypt/live/your-domain/privkey.pem
      - ${SSL_CERT_FULLCHAIN_PATH:-/etc/letsencrypt/live/5akeme/fullchain.pem}:/etc/letsencrypt/live/5akeme/fullchain.pem:ro
      - ${SSL_CERT_PRIVKEY_PATH:-/etc/letsencrypt/live/5akeme/privkey.pem}:/etc/letsencrypt/live/5akeme/privkey.pem:ro
      # Optional: certbot challenge files
      - ./docker/certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - appnet

  app:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: 5akeme-app
    working_dir: /var/www/html
    volumes:
      - ./api:/var/www/html
    depends_on:
      - db
    environment:
      - APP_ENV=production
      - PYTHON_API_URL=http://python:8000
    networks:
      - appnet

  python:
    build:
      context: .
      dockerfile: ./docker/python/Dockerfile
    container_name: 5akeme-python
    working_dir: /app
    volumes:
      - ./python:/app
      - python_data:/app/data
    environment:
      - DATABASE_URL=mysql+pymysql://${DB_USERNAME:-laravel}:${DB_PASSWORD:-laravel}@db:3306/${DB_DATABASE:-laravel}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    depends_on:
      - db
    networks:
      - appnet

  db:
    image: mysql:8.0
    container_name: 5akeme-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-laravel}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - appnet
    deploy:
      resources:
        limits:
          memory: 400M
        reservations:
          memory: 256M

volumes:
  dbdata:
  python_data:

networks:
  appnet:
    driver: bridge
